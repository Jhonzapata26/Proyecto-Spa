<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serena Centro Estetico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">🌸</div>
            <div>
                <h1>Serena</h1>
                <span>Sistema de agendamiento</span>
            </div>
        </div>
        <nav id="navbar" class="boton-header">
            <div class="user-chip" id="user-chip" hidden>
                <span class="user-name" id="user-name"></span>
                <span class="user-role" id="user-role"></span>
            </div>
            <button type="button" class="logout-btn" id="logout-btn" hidden>Salir</button>
        </nav>
    </header>
    <main>
    <form id="booking-form" class="form-grid" novalidate>
        <div class="section-header full">
            <div class="icon">📝</div>
            <div class="section-title">
                <h2 id="reserva">Nueva reserva</h2>
                <span class="section-date">Registro de cita</span>
            </div>
        </div>
        
        <div class="form-group">
        <label for="name">NOMBRE DEL CLIENTE</label>
        <input type="text" id="name" name="name" autocomplete="off" maxlength="60" required>
        </div>

        <div class="form-group">
        <label for="phone">TELÉFONO</label>
        <input type="tel" id="phone" name="phone" inputmode="numeric" pattern="[0-9]{10}" maxlength="10"
            placeholder="3001234567" title="Número de 10 dígitos, sin espacios" autocomplete="off" required>
        </div>
        
        <!--CREAMOS LAS OPCIONES CON TODOS LOS SERVICIOS QUE SE OFRECEN EN EL CENTRO ESTETICO -->
        <div class="form-group">
        <label for="service">SERVICIO</label>
        <!-- Las opciones vienen del servidor (server/config.js) -->
        <select id="service" name="service" required>
            <option value="">Seleccionar servicio</option>
        </select>
        </div>
        
        <div class="form-group">
        <label for="manager">PROFESIONAL ENCARGADA</label>
        <select name="manager" id="manager" required>
            <option value="">Seleccionar encargada</option>
        </select>
        </div>
        
        <div class="form-group">
        <label for="date">FECHA</label>
        <input type="date" id="date" name="date" required>
        </div>
        
        <div class="form-group">
        <label for="time">HORA</label>
        <select id="time" name="time" required disabled>
            <option value="">Elige fecha y profesional</option>
        </select>
        </div>
        
        <button type="submit">✅ Agendar cita</button>
    </form>
    <section id="day-schedule">
        <div class="section-header">
            <div class="icon">⏱️</div>
            <div class="section-title">
                <h2>Horario del día</h2>
                <span class="section-date" id="schedule-date"></span>
            </div>
            <span class="slots-badge" id="schedule-count"></span>
        </div>
        <div class="day-nav">
            <button type="button" class="day-nav-btn" id="schedule-prev" aria-label="Día anterior">‹</button>
            <input type="date" id="schedule-picker" aria-label="Elegir día">
            <button type="button" class="day-nav-btn" id="schedule-next" aria-label="Día siguiente">›</button>
            <button type="button" class="day-nav-today" id="schedule-today" hidden>Hoy</button>
        </div>
        <div id="schedule-slots" class="schedule-slots"></div>
    </section>
    <section id="scheduled-appointments">
        <div class="section-header">
            <div class="icon">📋</div>
            <div class="section-title">
                <h2>Citas agendadas</h2>
                <span class="section-date">Próximas citas, de la más cercana a la más lejana</span>
            </div>
            <span class="slots-badge" id="appointments-count"></span>
        </div>
        <ul id="appointments-list" class="appointments-list"></ul>
    </section>
    </main>

    <!-- Detalle de una cita: ver, editar, cerrar, cancelar y borrar -->
    <dialog id="appointment-dialog" class="dialog" aria-labelledby="detail-title">
        <div class="dialog-body">
            <div class="section-header">
                <div class="icon">🗓️</div>
                <div class="section-title">
                    <h2 id="detail-title">Detalle de la cita</h2>
                    <span class="section-date" id="detail-subtitle"></span>
                </div>
                <span class="status-badge" id="detail-status"></span>
                <button type="button" class="dialog-close" id="detail-close" aria-label="Cerrar">✕</button>
            </div>

            <div id="detail-view">
                <dl class="detail-list" id="detail-data"></dl>
                <p class="detail-note" id="detail-note" hidden></p>
                <div class="dialog-actions">
                    <button type="button" class="btn btn--primary" id="detail-attend">✔ Marcar atendida</button>
                    <button type="button" class="btn" id="detail-edit">✏️ Editar</button>
                    <button type="button" class="btn" id="detail-goto">Ver en el horario</button>
                </div>
                <div class="dialog-actions dialog-actions--secondary">
                    <button type="button" class="btn btn--danger-outline" id="detail-cancel">Cancelar cita</button>
                    <button type="button" class="btn btn--link-danger" id="detail-delete">🗑️ Borrar</button>
                </div>
            </div>

            <form id="edit-form" class="form-grid edit-form" novalidate hidden>
                <div class="form-group">
                    <label for="edit-name">NOMBRE DEL CLIENTE</label>
                    <input type="text" id="edit-name" autocomplete="off" maxlength="60" required>
                </div>
                <div class="form-group">
                    <label for="edit-phone">TELÉFONO</label>
                    <input type="tel" id="edit-phone" inputmode="numeric" pattern="[0-9]{10}" maxlength="10"
                        title="Número de 10 dígitos, sin espacios" autocomplete="off" required>
                </div>
                <div class="form-group">
                    <label for="edit-service">SERVICIO</label>
                    <select id="edit-service" required></select>
                </div>
                <div class="form-group">
                    <label for="edit-manager">PROFESIONAL ENCARGADA</label>
                    <select id="edit-manager" required></select>
                </div>
                <div class="form-group">
                    <label for="edit-date">FECHA</label>
                    <input type="date" id="edit-date" required>
                </div>
                <div class="form-group">
                    <label for="edit-time">HORA</label>
                    <select id="edit-time" required></select>
                </div>
                <div class="dialog-actions full">
                    <button type="button" class="btn" id="edit-back">Volver</button>
                    <button type="submit" class="btn btn--primary">Guardar cambios</button>
                </div>
            </form>
        </div>
    </dialog>

    <!-- Segunda confirmación para acciones delicadas -->
    <dialog id="confirm-dialog" class="dialog dialog--small" aria-labelledby="confirm-title">
        <div class="dialog-body">
            <h2 id="confirm-title" class="confirm-title"></h2>
            <p id="confirm-message" class="confirm-message"></p>
            <div class="dialog-actions">
                <button type="button" class="btn" id="confirm-no">No, volver</button>
                <button type="button" class="btn btn--primary" id="confirm-yes"></button>
            </div>
        </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" popover="manual"></div>
    <script src="config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/formulario.js"></script>
    <script src="js/horario.js"></script>
    <script src="js/citas.js"></script>
    <script src="js/detalle.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
