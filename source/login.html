<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar · Serena Centro Estético</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="login-main">
        <form id="login-form" class="login-card" novalidate>
            <div class="login-brand">
                <div class="logo-icon">🌸</div>
                <h1>Serena</h1>
                <span>Sistema de agendamiento</span>
            </div>

            <div class="form-group">
                <label for="usuario">USUARIO</label>
                <input type="text" id="usuario" name="usuario" autocomplete="username"
                    autocapitalize="none" spellcheck="false" required autofocus>
            </div>

            <div class="form-group">
                <label for="clave">CONTRASEÑA</label>
                <input type="password" id="clave" name="clave" autocomplete="current-password" required>
            </div>

            <p class="login-error" id="login-error" role="alert" hidden></p>

            <button type="submit" class="btn btn--primary login-submit">Ingresar</button>
        </form>
    </main>
    <script src="config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
